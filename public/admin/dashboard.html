<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Larizinha Store — Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color,#0d0d10);
    --bg2: var(--tg-theme-secondary-bg-color,#17171c);
    --bg3:#1f1f26;
    --text: var(--tg-theme-text-color,#fff);
    --hint: var(--tg-theme-hint-color,#8a8a93);
    --accent:#4ea1ff;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
    --purple:#a855f7;
    --pink:#ec4899;
    --cyan:#06b6d4;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding:16px 14px 40px;padding-top:calc(16px + env(safe-area-inset-top));
    overflow-x:hidden;
  }

  /* HEADER */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .header h1{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .header h1 span{color:var(--accent);}
  .header .sub{font-size:12px;color:var(--hint);margin-top:2px;}
  .refresh-btn{
    width:38px;height:38px;border-radius:12px;background:var(--bg2);
    border:1px solid rgba(255,255,255,.06);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    cursor:pointer;transition:transform .3s;
  }
  .refresh-btn:active{transform:rotate(180deg) scale(.95);}

  /* LOADING */
  .skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
    background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius);}
  @keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* STATS GRID */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat-card{
    background:var(--bg2);border-radius:var(--radius);padding:14px;
    border:1px solid rgba(255,255,255,.05);
    position:relative;overflow:hidden;
  }
  .stat-card .icon{font-size:20px;margin-bottom:6px;display:block;}
  .stat-card .value{font-size:19px;font-weight:800;letter-spacing:-.5px;}
  .stat-card .label{font-size:11px;color:var(--hint);margin-top:2px;}
  .stat-card::after{
    content:'';position:absolute;top:-20px;right:-20px;width:60px;height:60px;
    border-radius:50%;background:var(--accent);opacity:.08;
  }
  .stat-card.green::after{background:var(--success);}
  .stat-card.purple::after{background:var(--purple);}
  .stat-card.warning::after{background:var(--warning);}
  .stat-card.pink::after{background:var(--pink);}
  .stat-card.cyan::after{background:var(--cyan);}
  .stat-card.red::after{background:var(--danger);}

  /* SECTION */
  .section-title{
    font-size:14px;font-weight:700;margin:20px 0 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-title small{font-size:11px;color:var(--hint);font-weight:400;}

  /* CHART */
  .chart{
    background:var(--bg2);border-radius:var(--radius);padding:16px 12px;
    border:1px solid rgba(255,255,255,.05);
  }
  .chart-bars{
    display:flex;align-items:flex-end;justify-content:space-between;
    height:110px;gap:6px;
  }
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{
    width:100%;background:linear-gradient(180deg,var(--accent),#2563eb);
    border-radius:6px 6px 2px 2px;min-height:4px;transition:height .5s;
  }
  .bar-col .day{font-size:10px;color:var(--hint);}
  .bar-col .val{font-size:9px;color:var(--accent);font-weight:600;}

  /* QUICK NAV */
  .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .nav-item{
    background:var(--bg2);border:1px solid rgba(255,255,255,.05);
    border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;
    align-items:center;gap:5px;cursor:pointer;transition:transform .15s;
    text-align:center;
  }
  .nav-item:active{transform:scale(.95);background:var(--bg3);}
  .nav-item .emoji{font-size:22px;}
  .nav-item .name{font-size:9.5px;color:var(--hint);font-weight:500;line-height:1.1;}

  /* LIST ITEMS */
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{
    background:var(--bg2);border-radius:14px;padding:12px 14px;
    border:1px solid rgba(255,255,255,.05);
    display:flex;align-items:center;gap:10px;
  }
  .row .avatar{
    width:36px;height:36px;border-radius:10px;background:var(--bg3);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    flex-shrink:0;
  }
  .row .info{flex:1;min-width:0;}
  .row .info .top{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .info .bot{font-size:11px;color:var(--hint);margin-top:1px;}
  .row .right{font-size:13px;font-weight:700;color:var(--success);text-align:right;}
  .row .right.small{font-size:11px;color:var(--hint);font-weight:400;}

  .empty{
    text-align:center;padding:24px;color:var(--hint);font-size:12px;
    background:var(--bg2);border-radius:14px;
    border:1px dashed rgba(255,255,255,.08);
  }

  .badge-estoque{
    background:rgba(239,68,68,.15);color:#fca5a5;font-size:10px;
    padding:3px 7px;border-radius:6px;font-weight:700;
  }

  /* TOAST */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--bg3);color:var(--text);padding:10px 18px;border-radius:999px;
    font-size:12px;font-weight:600;opacity:0;transition:all .3s;z-index:100;
    border:1px solid rgba(255,255,255,.08);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Module placeholder feedback */
  .soon-toast{background:rgba(78,161,255,.9);}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Larizinha <span>Admin</span></h1>
    <div class="sub" id="adminName">Carregando…</div>
  </div>
  <button class="refresh-btn" id="refreshBtn">🔄</button>
</div>

<!-- STATS -->
<div class="stats-grid" id="statsGrid">
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
  <div class="stat-card skeleton" style="height:88px"></div>
</div>

<!-- CHART -->
<div class="section-title">📈 Faturamento (7 dias) <small id="total7d">—</small></div>
<div class="chart">
  <div class="chart-bars" id="chartBars"></div>
</div>

<!-- QUICK NAV -->
<div class="section-title">⚡ Acesso Rápido</div>
<div class="nav-grid" id="navGrid"></div>

<!-- ÚLTIMAS VENDAS -->
<div class="section-title">🛍️ Últimas Vendas <small id="vendasCount">—</small></div>
<div class="list" id="ultimasVendas"></div>

<!-- ESTOQUE BAIXO -->
<div class="section-title">⚠️ Estoque Baixo</div>
<div class="list" id="estoqueBaixo"></div>

<!-- ÚLTIMOS CLIENTES -->
<div class="section-title">👥 Novos Clientes</div>
<div class="list" id="ultimosClientes"></div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0d0d10'); }

const fmt = n => 'R$ ' + Number(n||0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtInt = n => Number(n||0).toLocaleString('pt-BR');
const curto = id => '••••' + String(id).slice(-4);
const tempoAtras = iso => {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return Math.floor(diff/60) + 'min';
  if (diff < 86400) return Math.floor(diff/3600) + 'h';
  return Math.floor(diff/86400) + 'd';
};

// NAV ITEMS - link para cada módulo (placeholders preenchidos quando você gerar)
const NAV = [
  { emoji:'🎛️', nome:'Botões',     href:'/admin/buttons.html'     },
  { emoji:'📝', nome:'Mensagens',  href:'/admin/messages.html'    },
  { emoji:'📦', nome:'Produtos',   href:'/admin/products.html'    },
  { emoji:'👥', nome:'Usuários',   href:'/admin/users.html'       },
  { emoji:'🛍️', nome:'Vendas',    href:'/admin/orders.html'      },
  { emoji:'💳', nome:'PIX',       href:'/admin/pix.html'         },
  { emoji:'🎁', nome:'Gift Cards', href:'/admin/giftcards.html'   },
  { emoji:'💰', nome:'Afiliados',  href:'/admin/affiliates.html'  },
  { emoji:'⭐', nome:'Pontos',     href:'/admin/points.html'      },
  { emoji:'🏆', nome:'Rankings',   href:'/admin/rankings.html'    },
  { emoji:'🛒', nome:'Carrinho',   href:'/admin/cart.html'        },
  { emoji:'🔔', nome:'Canal',      href:'/admin/channel.html'     },
  { emoji:'🎟️', nome:'Cupons',    href:'/admin/coupons.html'     },
  { emoji:'🆘', nome:'Suporte',    href:'/admin/support.html'     },
  { emoji:'⚙️', nome:'Config',    href:'/admin/settings.html'    },
  { emoji:'📊', nome:'Relatórios', href:'/admin/reports.html'     },
];

function renderNav(){
  const el = document.getElementById('navGrid');
  el.innerHTML = NAV.map(n => `
    <div class="nav-item" data-href="${n.href}">
      <span class="emoji">${n.emoji}</span>
      <span class="name">${n.nome}</span>
    </div>
  `).join('');
  el.querySelectorAll('.nav-item').forEach(it => {
    it.onclick = () => {
      const href = it.dataset.href;
      if (tg) tg.openLink(href, { try_instant_view: false });
      else window.location.href = href;
    };
  });
}

function toast(msg, color){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (color ? ' ' + color : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2200);
}

function renderStats(s){
  const cards = [
    { icon:'👥', value: fmtInt(s.usuarios), label:'Usuários', class:'' },
    { icon:'📦', value: fmtInt(s.produtos), label:'Produtos ativos', class:'cyan' },
    { icon:'🛍️', value: fmtInt(s.vendasHoje), label:'Vendas hoje', class:'green' },
    { icon:'💰', value: fmt(s.faturamentoHoje), label:'Faturamento hoje', class:'green' },
    { icon:'📈', value: fmt(s.faturamentoMes), label:'Faturamento mês', class:'purple' },
    { icon:'⏳', value: fmt(s.pixPendenteTotal), label:`${s.pixPendenteQtd} PIX pendente(s)`, class:'warning' },
    { icon:'📊', value: fmtInt(s.estoqueTotal), label:'Estoque total', class:'pink' },
    { icon:'💳', value: fmt(s.saldoCirculacao), label:'Saldo em circulação', class:'red' },
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c => `
    <div class="stat-card ${c.class}">
      <span class="icon">${c.icon}</span>
      <div class="value">${c.value}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join('');
}

function renderChart(dias){
  const el = document.getElementById('chartBars');
  const max = Math.max(...dias.map(d => d.total), 1);
  const total = dias.reduce((a,b)=>a+b.total,0);
  document.getElementById('total7d').textContent = 'Total: ' + fmt(total);

  el.innerHTML = dias.map(d => {
    const h = Math.max((d.total/max)*100, 4);
    const day = new Date(d.dia+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3);
    return `
      <div class="bar-col">
        <div class="val">${d.total > 0 ? 'R$'+d.total.toFixed(0) : ''}</div>
        <div class="bar" style="height:${h}%"></div>
        <div class="day">${day}</div>
      </div>
    `;
  }).join('');
}

function renderVendas(rows){
  const el = document.getElementById('ultimasVendas');
  document.getElementById('vendasCount').textContent = rows.length ? `últimas ${rows.length}` : '';
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Nenhuma venda ainda.</div>';
    return;
  }
  el.innerHTML = rows.map(r => `
    <div class="row">
      <div class="avatar">🛍️</div>
      <div class="info">
        <div class="top">${r.produto_nome || 'Produto'}</div>
        <div class="bot">${r.user_nome || curto(r.user_id)} • ${tempoAtras(r.data)}</div>
      </div>
      <div class="right">${fmt(r.valor)}</div>
    </div>
  `).join('');
}

function renderEstoque(rows){
  const el = document.getElementById('estoqueBaixo');
  if (!rows.length) {
    el.innerHTML = '<div class="empty">✅ Todos os produtos com estoque saudável.</div>';
    return;
  }
  el.innerHTML = rows.map(r => `
    <div class="row">
      <div class="avatar">⚠️</div>
      <div class="info">
        <div class="top">${r.nome}</div>
        <div class="bot">Estoque atual</div>
      </div>
      <span class="badge-estoque">${r.estoque} un.</span>
    </div>
  `).join('');
}

function renderClientes(rows){
  const el = document.getElementById('ultimosClientes');
  if (!rows.length) {
    el.innerHTML = '<div class="empty">Nenhum cliente cadastrado.</div>';
    return;
  }
  el.innerHTML = rows.map(r => `
    <div class="row">
      <div class="avatar">👤</div>
      <div class="info">
        <div class="top">${r.nome || curto(r.user_id)}</div>
        <div class="bot">${tempoAtras(r.criado_em)} atrás</div>
      </div>
      <div class="right small">${fmt(r.saldo)}</div>
    </div>
  `).join('');
}

async function carregarDashboard(){
  try {
    const initData = tg?.initData || '';
    const res = await fetch('/api/admin/dashboard', {
      headers: { 'x-telegram-init-data': initData }
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Erro');

    document.getElementById('adminName').textContent =
      '👋 ' + (data.admin.nome || 'Admin') + ' • ID ' + curto(data.admin.id);

    renderStats(data.stats);
    renderChart(data.faturamento7Dias);
    renderVendas(data.ultimasVendas);
    renderEstoque(data.estoqueBaixo);
    renderClientes(data.ultimosClientes);
  } catch (e) {
    console.error(e);
    toast('❌ ' + (e.message || 'Erro ao carregar'));
  }
}

document.getElementById('refreshBtn').onclick = () => {
  toast('🔄 Atualizando…');
  carregarDashboard();
};

renderNav();
carregarDashboard();
setInterval(carregarDashboard, 30000); // auto refresh 30s
</script>

</body>
</html>
